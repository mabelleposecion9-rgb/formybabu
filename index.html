<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For My Baby ♡</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  padding: 20px;

  display: flex;
  align-items: center;
  justify-content: center;

  background: #f8f4f1;
  color: #514944;

  font-family: Georgia, "Times New Roman", serif;
}

.container {
  width: 100%;
  max-width: 560px;
}

.card {
  background: rgba(255,255,255,0.94);

  border: 1px solid #e7ddd7;
  border-radius: 25px;

  padding: 38px 28px;

  text-align: center;

  box-shadow:
    0 12px 35px rgba(80,65,55,0.08);
}

.hidden {
  display: none;
}

.heart {
  font-size: 30px;
  color: #b9a095;

  margin-bottom: 12px;
}

h1 {
  font-size: 29px;
  font-weight: 500;

  margin: 0 0 10px;
}

.subtitle {
  color: #9b8c84;

  font-size: 15px;
  line-height: 1.6;
}

.passwordInput {
  width: 100%;

  margin-top: 25px;
  padding: 14px 16px;

  border: 1px solid #ded2cb;
  border-radius: 14px;

  background: #fffdfb;

  font-family: Georgia, "Times New Roman", serif;
  font-size: 15px;

  text-align: center;

  outline: none;
}

.passwordInput:focus {
  border-color: #bfaea5;
}

button {
  border: none;
  border-radius: 14px;

  padding: 12px 22px;

  font-family: Georgia, "Times New Roman", serif;
  font-size: 14px;

  cursor: pointer;
}

.openButton {
  margin-top: 12px;

  background: #b9a197;
  color: white;
}

.error {
  min-height: 18px;

  margin-top: 10px;

  color: #a46f6f;

  font-size: 12px;
}

.reasonNumber {
  font-size: 12px;

  letter-spacing: 2px;

  color: #a4958d;

  margin-bottom: 18px;
}

.line {
  width: 45px;
  height: 1px;

  background: #ded3cd;

  margin: 20px auto;
}

textarea {
  width: 100%;

  min-height: 170px;

  resize: vertical;

  padding: 18px;

  border: 1px solid #ded2cb;
  border-radius: 16px;

  background: #fffdfb;

  color: #514944;

  font-family: Georgia, "Times New Roman", serif;

  font-size: 17px;

  line-height: 1.6;

  outline: none;
}

textarea:focus {
  border-color: #bfaea5;
}

textarea::placeholder {
  color: #b8ada7;
}

.saved {
  height: 18px;

  margin-top: 8px;

  color: #a28e84;

  font-size: 12px;
}

.buttons {
  display: flex;

  justify-content: center;

  gap: 10px;

  margin-top: 15px;
}

.back {
  background: #eee6e1;

  color: #716760;
}

.next {
  background: #b9a197;

  color: white;
}

button:disabled {
  opacity: 0.4;

  cursor: not-allowed;
}

.counter {
  margin-top: 14px;

  color: #a39892;

  font-size: 12px;
}

.footer {
  margin-top: 25px;

  color: #b0a49e;

  font-size: 12px;
}

.finalText {
  font-size: 18px;

  line-height: 1.8;
}

.small {
  margin-top: 20px;

  font-size: 12px;

  color: #a39892;
}


/* MOBILE */

@media (max-width: 480px) {

  .card {
    padding: 32px 20px;
  }

  h1 {
    font-size: 26px;
  }

  textarea {
    font-size: 16px;
  }

}
</style>

</head>

<body>

<div class="container">


<!-- =========================
     INTRO / PASSWORD
========================= -->

<div class="card" id="passwordScreen">

  <div class="heart">♡</div>

  <h1>For My Baby ♡</h1>

  <div class="subtitle">
    A lil something from ur Mabby.
  </div>

  <input
    class="passwordInput"
    id="passwordInput"
    type="password"
    placeholder="enter the password"
  >

  <button
    class="openButton"
    onclick="openBook()"
  >
    Open my heart ♡
  </button>

  <div
    class="error"
    id="passwordError"
  ></div>

</div>



<!-- =========================
     EDITING PAGE
========================= -->

<div
  class="card hidden"
  id="book"
>

  <div class="heart">♡</div>

  <div
    class="reasonNumber"
    id="reasonNumber"
  >
    REASON 01 OF 100
  </div>

  <div class="line"></div>


  <textarea
    id="reasonInput"
    placeholder="Write your reason here..."
  ></textarea>


  <div
    class="saved"
    id="savedMessage"
  ></div>


  <div class="buttons">

    <button
      class="back"
      id="backButton"
      onclick="previousReason()"
    >
      ← Back
    </button>


    <button
      class="next"
      onclick="nextReason()"
    >
      Next →
    </button>

  </div>


  <div
    class="counter"
    id="counter"
  >
    1 / 100
  </div>


  <div class="footer">
    Your reasons save automatically ♡
  </div>

</div>



<!-- =========================
     FINISHED PAGE
========================= -->

<div
  class="card hidden"
  id="finishedPage"
>

  <div class="heart">♡</div>

  <div class="finalText">

    <h1>That's all 100. ♡</h1>

    <div class="line"></div>

    <p>
      But honestly...
    </p>

    <p>
      I could probably write<br>
      a hundred more.
    </p>

    <p>
      Thank you for being you, Baby.
    </p>

    <p>
      <strong>Mabby</strong> ♡
    </p>

  </div>

</div>


</div>



<script>

/* =====================================================
   PASSWORD
===================================================== */

const PASSWORD = "I love you";


/* =====================================================
   NUMBER OF REASONS
===================================================== */

const TOTAL_REASONS = 100;


/* =====================================================
   STORAGE

   This is where your reasons are saved in your browser.
===================================================== */

const STORAGE_KEY = "mabby_babu_100_reasons";


/* =====================================================
   LOAD YOUR SAVED REASONS
===================================================== */

let reasons =
  JSON.parse(
    localStorage.getItem(STORAGE_KEY)
  ) || Array(TOTAL_REASONS).fill("");


/* =====================================================
   CURRENT REASON
===================================================== */

let currentReason = 0;


/* =====================================================
   OPEN BOOK
===================================================== */

function openBook() {

  const enteredPassword =
    document
      .getElementById("passwordInput")
      .value;


  if (enteredPassword === PASSWORD) {

    document
      .getElementById("passwordScreen")
      .classList.add("hidden");


    document
      .getElementById("book")
      .classList.remove("hidden");


    showReason();

  }

  else {

    document
      .getElementById("passwordError")
      .textContent =
      "That's not it, Baby ♡";

  }

}


/* =====================================================
   SHOW CURRENT REASON
===================================================== */

function showReason() {

  document
    .getElementById("reasonNumber")
    .textContent =
    "REASON " +
    String(currentReason + 1).padStart(2, "0") +
    " OF 100";


  document
    .getElementById("counter")
    .textContent =
    (currentReason + 1) +
    " / 100";


  document
    .getElementById("reasonInput")
    .value =
    reasons[currentReason];


  document
    .getElementById("savedMessage")
    .textContent = "";


  document
    .getElementById("backButton")
    .disabled =
    currentReason === 0;

}


/* =====================================================
   SAVE REASON
===================================================== */

function saveReason() {

  reasons[currentReason] =
    document
      .getElementById("reasonInput")
      .value;


  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(reasons)
  );


  document
    .getElementById("savedMessage")
    .textContent =
    "Saved ♡";

}


/* =====================================================
   AUTO SAVE WHILE TYPING
===================================================== */

document
  .getElementById("reasonInput")
  .addEventListener(
    "input",
    function() {

      reasons[currentReason] =
        this.value;


      localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(reasons)
      );


      document
        .getElementById("savedMessage")
        .textContent =
        "Saved ♡";

    }
  );


/* =====================================================
   NEXT REASON
===================================================== */

function nextReason() {

  saveReason();


  if (
    currentReason <
    TOTAL_REASONS - 1
  ) {

    currentReason++;

    showReason();

  }

  else {

    document
      .getElementById("book")
      .classList.add("hidden");


    document
      .getElementById("finishedPage")
      .classList.remove("hidden");

  }

}


/* =====================================================
   PREVIOUS REASON
===================================================== */

function previousReason() {

  saveReason();


  if (currentReason > 0) {

    currentReason--;

    showReason();

  }

}


/* =====================================================
   ENTER KEY FOR PASSWORD
===================================================== */

document
  .getElementById("passwordInput")
  .addEventListener(
    "keydown",
    function(event) {

      if (event.key === "Enter") {

        openBook();

      }

    }
  );

</script>

</body>
</html>
