<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>100 Reasons Why I Love You ♡</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Georgia, "Times New Roman", serif;
  background: #f8f4f1;
  color: #514944;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.container {
  width: 100%;
  max-width: 600px;
}

.card {
  background: rgba(255,255,255,0.9);
  border: 1px solid #e7ddd7;
  border-radius: 25px;
  padding: 40px 30px;
  text-align: center;
  box-shadow: 0 12px 35px rgba(80,65,55,0.08);
}

h1 {
  font-size: 30px;
  font-weight: 500;
  margin: 0 0 10px;
}

.subtitle {
  color: #9b8c84;
  font-size: 15px;
  margin-bottom: 35px;
}

.heart {
  font-size: 25px;
  color: #b9a095;
  margin-bottom: 12px;
}

.reason-number {
  font-size: 12px;
  letter-spacing: 2px;
  color: #a4958d;
  margin-bottom: 20px;
}

textarea {
  width: 100%;
  min-height: 140px;
  resize: vertical;
  border: 1px solid #e1d6d0;
  border-radius: 16px;
  background: #fffdfb;
  padding: 18px;
  font-family: Georgia, "Times New Roman", serif;
  font-size: 17px;
  line-height: 1.6;
  color: #514944;
  outline: none;
}

textarea:focus {
  border-color: #c9b6ac;
}

textarea::placeholder {
  color: #b8ada7;
}

.buttons {
  display: flex;
  justify-content: center;
  gap: 12px;
  margin-top: 18px;
}

button {
  border: none;
  border-radius: 14px;
  padding: 12px 23px;
  font-family: Georgia, "Times New Roman", serif;
  font-size: 14px;
  cursor: pointer;
}

.back {
  background: #eee6e1;
  color: #716760;
}

.next {
  background: #b9a197;
  color: white;
}

button:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

.counter {
  margin-top: 15px;
  font-size: 12px;
  color: #a39892;
}

.saved {
  margin-top: 10px;
  font-size: 12px;
  color: #a28e84;
  min-height: 16px;
}

.line {
  width: 45px;
  height: 1px;
  background: #ded3cd;
  margin: 25px auto;
}

.footer {
  margin-top: 25px;
  font-size: 12px;
  color: #b0a49e;
}

.final {
  font-size: 18px;
  line-height: 1.8;
}

.hidden {
  display: none;
}

@media (max-width: 480px) {
  .card {
    padding: 32px 20px;
  }

  h1 {
    font-size: 26px;
  }

  textarea {
    font-size: 16px;
  }
}
</style>
</head>

<body>

<div class="container">

  <!-- MAIN BOOK -->
  <div class="card" id="book">

    <div class="heart">♡</div>

    <h1>100 reasons why I love you</h1>

    <div class="subtitle">
      from Mabby, with love ♡
    </div>

    <div class="reason-number" id="reasonNumber">
      REASON 01 OF 100
    </div>

    <div class="line"></div>

    <textarea
      id="reasonInput"
      placeholder="Write your reason here..."
    ></textarea>

    <div class="saved" id="savedMessage"></div>

    <div class="buttons">

      <button
        class="back"
        id="backButton"
        onclick="previousReason()">
        ← Back
      </button>

      <button
        class="next"
        onclick="nextReason()">
        Next →
      </button>

    </div>

    <div class="counter" id="counter">
      1 / 100
    </div>

    <div class="footer">
      Take your time. You don't have to finish everything today. ♡
    </div>

  </div>


  <!-- FINAL PAGE -->

  <div class="card hidden" id="finalPage">

    <div class="heart">♡</div>

    <div class="final">

      <h1>That's all 100. ♡</h1>

      <div class="line"></div>

      <p>
        But honestly...
      </p>

      <p>
        I could probably write a hundred more.
      </p>

      <p>
        Thank you for being you, Babu.
      </p>

      <p>
        With love,<br>
        <strong>Mabby</strong> ♡
      </p>

    </div>

  </div>

</div>


<script>

/* -------------------------------------------------
   SETTINGS
------------------------------------------------- */

const TOTAL_REASONS = 100;

/*
   This is where your reasons are stored.

   localStorage means the reasons stay saved
   even after you close and reopen the website.
*/

const STORAGE_KEY = "mabby_100_reasons";


/* -------------------------------------------------
   LOAD SAVED REASONS
------------------------------------------------- */

let reasons = JSON.parse(
  localStorage.getItem(STORAGE_KEY)
) || Array(TOTAL_REASONS).fill("");

let currentReason = 0;


/* -------------------------------------------------
   ELEMENTS
------------------------------------------------- */

const input = document.getElementById("reasonInput");
const numberText = document.getElementById("reasonNumber");
const counter = document.getElementById("counter");
const savedMessage = document.getElementById("savedMessage");
const backButton = document.getElementById("backButton");


/* -------------------------------------------------
   SHOW CURRENT REASON
------------------------------------------------- */

function showReason() {

  numberText.textContent =
    "REASON " +
    String(currentReason + 1).padStart(2, "0") +
    " OF 100";

  counter.textContent =
    (currentReason + 1) + " / 100";

  input.value = reasons[currentReason];

  savedMessage.textContent = "";

  backButton.disabled = currentReason === 0;
}


/* -------------------------------------------------
   SAVE CURRENT REASON
------------------------------------------------- */

function saveCurrentReason() {

  reasons[currentReason] = input.value;

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(reasons)
  );

  savedMessage.textContent = "Saved ♡";

}


/* -------------------------------------------------
   AUTO-SAVE WHILE TYPING
------------------------------------------------- */

input.addEventListener("input", function() {

  saveCurrentReason();

});


/* -------------------------------------------------
   NEXT
------------------------------------------------- */

function nextReason() {

  saveCurrentReason();

  if (currentReason < TOTAL_REASONS - 1) {

    currentReason++;

    showReason();

  } else {

    document.getElementById("book")
      .classList.add("hidden");

    document.getElementById("finalPage")
      .classList.remove("hidden");

  }

}


/* -------------------------------------------------
   BACK
------------------------------------------------- */

function previousReason() {

  saveCurrentReason();

  if (currentReason > 0) {

    currentReason--;

    showReason();

  }

}


/* -------------------------------------------------
   START
------------------------------------------------- */

showReason();

</script>

</body>
</html>
