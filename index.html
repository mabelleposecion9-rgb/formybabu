<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For My Baby ♡</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  padding: 20px;
  display: flex;
  align-items: center;
  justify-content: center;

  background: #f8f4f1;
  color: #514944;

  font-family: Georgia, "Times New Roman", serif;
}

.container {
  width: 100%;
  max-width: 600px;
}

.card {
  background: rgba(255,255,255,0.92);
  border: 1px solid #e7ddd7;
  border-radius: 25px;
  padding: 38px 28px;
  text-align: center;

  box-shadow:
    0 12px 35px rgba(80,65,55,0.08);
}

.hidden {
  display: none;
}

.heart {
  font-size: 30px;
  color: #b9a095;
  margin-bottom: 12px;
}

h1 {
  font-size: 29px;
  font-weight: 500;
  margin: 0 0 10px;
}

.subtitle {
  color: #9b8c84;
  font-size: 15px;
  line-height: 1.6;
}

input {
  width: 100%;
  margin-top: 25px;
  padding: 14px 16px;

  border: 1px solid #ded2cb;
  border-radius: 14px;

  background: #fffdfb;

  font-family: Georgia, "Times New Roman", serif;
  font-size: 15px;

  text-align: center;
  outline: none;
}

input:focus {
  border-color: #bfaea5;
}

button {
  border: none;
  border-radius: 14px;

  padding: 12px 22px;

  font-family: Georgia, "Times New Roman", serif;
  font-size: 14px;

  cursor: pointer;
}

.openButton {
  margin-top: 12px;
  background: #b9a197;
  color: white;
}

.error {
  min-height: 18px;
  margin-top: 10px;

  color: #a46f6f;
  font-size: 12px;
}

.reasonNumber {
  font-size: 12px;
  letter-spacing: 2px;
  color: #a4958d;

  margin-top: 8px;
  margin-bottom: 18px;
}

.line {
  width: 45px;
  height: 1px;

  background: #ded3cd;

  margin: 20px auto;
}

.reasonText {
  min-height: 160px;

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 10px;

  font-size: 19px;
  line-height: 1.7;
}

textarea {
  width: 100%;
  min-height: 150px;

  resize: vertical;

  padding: 17px;

  border: 1px solid #ded2cb;
  border-radius: 16px;

  background: #fffdfb;

  color: #514944;

  font-family: Georgia, "Times New Roman", serif;
  font-size: 17px;
  line-height: 1.6;

  outline: none;
}

textarea:focus {
  border-color: #bfaea5;
}

.saved {
  height: 18px;

  margin-top: 8px;

  color: #a28e84;
  font-size: 12px;
}

.buttons {
  display: flex;
  justify-content: center;
  gap: 10px;

  margin-top: 15px;
}

.back {
  background: #eee6e1;
  color: #716760;
}

.next {
  background: #b9a197;
  color: white;
}

.counter {
  margin-top: 14px;

  color: #a39892;
  font-size: 12px;
}

.footer {
  margin-top: 25px;

  color: #b0a49e;
  font-size: 12px;
}

.finalText {
  font-size: 18px;
  line-height: 1.8;
}

.finalText strong {
  font-weight: 500;
}

.editNotice {
  margin-top: 15px;

  color: #a39892;
  font-size: 11px;
}

@media (max-width: 480px) {

  .card {
    padding: 32px 20px;
  }

  h1 {
    font-size: 26px;
  }

  .reasonText {
    font-size: 18px;
  }

}
</style>
</head>


<body>

<div class="container">


<!-- =========================
     PASSWORD SCREEN
========================= -->

<div class="card" id="passwordScreen">

  <div class="heart">♡</div>

  <h1>For My Baby ♡</h1>

  <div class="subtitle">
    A lil something from ur Mabby.
  </div>

  <input
    type="password"
    id="passwordInput"
    placeholder="enter the password"
  >

  <button
    class="openButton"
    onclick="checkPassword()"
  >
    Open my heart ♡
  </button>

  <div class="error" id="passwordError"></div>

</div>



<!-- =========================
     VIEWING MODE
========================= -->

<div class="card hidden" id="viewMode">

  <div class="heart">♡</div>

  <div class="reasonNumber" id="viewNumber">
    REASON 01 OF 100
  </div>

  <div class="line"></div>

  <div class="reasonText" id="viewReason">
    ...
  </div>

  <div class="buttons">

    <button
      class="back"
      id="viewBack"
      onclick="viewPrevious()"
    >
      ← Back
    </button>

    <button
      class="next"
      onclick="viewNext()"
    >
      Next →
    </button>

  </div>

  <div class="counter" id="viewCounter">
    1 / 100
  </div>

  <div class="footer">
    ♡ from Mabby
  </div>

</div>



<!-- =========================
     EDITING MODE
========================= -->

<div class="card hidden" id="editMode">

  <div class="heart">♡</div>

  <div class="reasonNumber" id="editNumber">
    REASON 01 OF 100
  </div>

  <div class="line"></div>

  <textarea
    id="reasonInput"
    placeholder="Write your reason here..."
  ></textarea>

  <div class="saved" id="savedMessage"></div>

  <div class="buttons">

    <button
      class="back"
      id="editBack"
      onclick="editPrevious()"
    >
      ← Back
    </button>

    <button
      class="next"
      onclick="editNext()"
    >
      Next →
    </
